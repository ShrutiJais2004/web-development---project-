<!DOCTYPE html>
<html>

<head>

  <title>Register</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

  <h1>Task Manager</h1>

  <h2>Register</h2>

  <input
    type="text"
    id="username"
    placeholder="Create Username"
  >

  <input
    type="password"
    id="password"
    placeholder="Create Password"
  >

  <button onclick="register()">
    Register
  </button>

  <p>

    Already have account?

    <a href="login.html">
      Login
    </a>

  </p>

</div>

<script src="script.js"></script>

</body>
</html>
